<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dental Conference Quiz</title>
  <style>
    :root {
      --bg: #f4f8f9;
      --card: #ffffff;
      --text: #102a30;
      --muted: #526f75;
      --border: #d5e4e7;
      --accent: #006874;
      --accent-hover: #004f58;
      --opt-bg: #f8fbfc;
      --opt-hover: #ebf5f7;
      --correct-bg: #d9f5e5;
      --correct-border: #1e9e5a;
      --correct-text: #0f5c33;
      --wrong-bg: #fde2e2;
      --wrong-border: #d9383a;
      --wrong-text: #7f1d1d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1719;
        --card: #152427;
        --text: #e8f3f5;
        --muted: #93b0b6;
        --border: #253d42;
        --accent: #38b6c4;
        --accent-hover: #56c8d5;
        --opt-bg: #1b2e32;
        --opt-hover: #22393e;
        --correct-bg: #133b27;
        --correct-border: #2ecc71;
        --correct-text: #a7f3c8;
        --wrong-bg: #42191a;
        --wrong-border: #ef5350;
        --wrong-text: #ffcdd2;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0, 104, 116, 0.1);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .counter {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 500;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--opt-bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--accent);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--border);
      font-weight: 700;
      font-size: 0.88rem;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .option-btn.correct .opt-letter {
      background: var(--correct-border);
      color: #ffffff;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .option-btn.wrong .opt-letter {
      background: var(--wrong-border);
      color: #ffffff;
    }

    .explanation {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--opt-bg);
      border-left: 4px solid var(--accent);
      font-size: 0.94rem;
      line-height: 1.5;
      display: none;
    }

    .explanation.show {
      display: block;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .next-btn:hover {
      background: var(--accent-hover);
    }

    .next-btn.show {
      display: inline-block;
    }

    .loading {
      text-align: center;
      padding: 36px 0;
      color: var(--muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">Dental Booth Quiz</span>
      <span class="counter" id="statusText">Loading...</span>
    </div>

    <div id="loadingBox" class="loading">Loading dental questions...</div>

    <div id="quizBox" style="display: none;">
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="explanation" id="explanationBox"></div>
      <div class="actions">
        <button class="next-btn" id="nextBtn" onclick="renderNextQuestion()">Next Question →</button>
      </div>
    </div>
  </div>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1m0hWSLClOUzIHXOcQy4QzXAikNedv_IPfRN7IMJUUfI/gviz/tq?tqx=out:csv";
    const ALLOW_NEXT = true;

    const FALLBACK_QUESTIONS = [
      {
        question: "Which tooth is the first permanent tooth to erupt?",
        A: "Mandibular first molar",
        B: "Maxillary central incisor",
        C: "Mandibular canine",
        D: "Maxillary first premolar",
        correct: "A",
        explanation: "The mandibular first molar typically erupts around age 6."
      }
    ];

    let allQuestions = [];
    const STORAGE_KEY = "dental_quiz_seen_indices_40_v1";

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"' && inQuotes && next === '"') {
          cell += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === "," && !inQuotes) {
          row.push(cell.trim());
          cell = "";
        } else if ((ch === "\n" || (ch === "\r" && next === "\n")) && !inQuotes) {
          if (ch === "\r") i++;
          row.push(cell.trim());
          if (row.some(v => v !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }
      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        if (row.some(v => v !== "")) rows.push(row);
      }

      if (rows.length < 2) return [];

      const headers = rows[0].map(h => h.toLowerCase().trim());
      const qIdx = headers.indexOf("question");
      const aIdx = headers.indexOf("a");
      const bIdx = headers.indexOf("b");
      const cIdx = headers.indexOf("c");
      const dIdx = headers.indexOf("d");
      const corrIdx = headers.indexOf("correct");
      const expIdx = headers.indexOf("explanation");

      if (qIdx === -1 || aIdx === -1 || bIdx === -1 || cIdx === -1 || dIdx === -1 || corrIdx === -1) {
        return [];
      }

      const parsed = [];
      for (let r = 1; r < rows.length; r++) {
        const cols = rows[r];
        const q = cols[qIdx];
        const corr = (cols[corrIdx] || "").toUpperCase().trim();
        if (q && ["A", "B", "C", "D"].includes(corr)) {
          parsed.push({
            question: q,
            A: cols[aIdx] || "",
            B: cols[bIdx] || "",
            C: cols[cIdx] || "",
            D: cols[dIdx] || "",
            correct: corr,
            explanation: expIdx !== -1 ? (cols[expIdx] || "") : ""
          });
        }
      }
      return parsed;
    }

    function getUnseenQuestionIndex(total) {
      let seen = [];
      try {
        seen = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) {
        seen = [];
      }

      let available = [];
      for (let i = 0; i < total; i++) {
        if (!seen.includes(i)) available.push(i);
      }

      if (available.length === 0) {
        seen = [];
        for (let i = 0; i < total; i++) available.push(i);
      }

      const chosen = available[Math.floor(Math.random() * available.length)];
      seen.push(chosen);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seen));
      } catch (e) {}

      return chosen;
    }

    function renderNextQuestion() {
      const idx = getUnseenQuestionIndex(allQuestions.length);
      const item = allQuestions[idx];

      document.getElementById("statusText").textContent = `Question #${idx + 1} of ${allQuestions.length}`;
      document.getElementById("questionText").textContent = item.question;

      const expBox = document.getElementById("explanationBox");
      expBox.classList.remove("show");
      expBox.textContent = "";

      const nextBtn = document.getElementById("nextBtn");
      nextBtn.classList.remove("show");

      const optionsContainer = document.getElementById("optionsContainer");
      optionsContainer.innerHTML = "";

      const displayLetters = ["A", "B", "C", "D"];
      const entries = [
        { key: "A", text: item.A },
        { key: "B", text: item.B },
        { key: "C", text: item.C },
        { key: "D", text: item.D }
      ];

      for (let i = entries.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [entries[i], entries[j]] = [entries[j], entries[i]];
      }

      entries.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.dataset.isCorrect = (opt.key === item.correct) ? "true" : "false";

        const letterSpan = document.createElement("span");
        letterSpan.className = "opt-letter";
        letterSpan.textContent = displayLetters[i];

        const textSpan = document.createElement("span");
        textSpan.textContent = opt.text;

        btn.appendChild(letterSpan);
        btn.appendChild(textSpan);

        btn.onclick = () => handleAnswer(btn, item.explanation);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedBtn, explanation) {
      const buttons = document.querySelectorAll(".option-btn");
      const isCorrect = selectedBtn.dataset.isCorrect === "true";

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.isCorrect === "true") {
          btn.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedBtn.classList.add("wrong");
      }

      if (explanation) {
        const expBox = document.getElementById("explanationBox");
        expBox.textContent = explanation;
        expBox.classList.add("show");
      }

      if (ALLOW_NEXT) {
        document.getElementById("nextBtn").classList.add("show");
      }
    }

    async function initQuiz() {
      try {
        if (SHEET_CSV_URL && SHEET_CSV_URL.startsWith("http")) {
          const res = await fetch(SHEET_CSV_URL);
          if (res.ok) {
            const csvText = await res.text();
            const parsed = parseCSV(csvText);
            if (parsed.length > 0) {
              allQuestions = parsed;
            }
          }
        }
      } catch (err) {
        console.warn("Could not load Google Sheet CSV, using fallback questions.", err);
      }

      if (allQuestions.length === 0) {
        allQuestions = FALLBACK_QUESTIONS;
      }

      document.getElementById("loadingBox").style.display = "none";
      document.getElementById("quizBox").style.display = "block";
      renderNextQuestion();
    }

    initQuiz();
  </script>
</body>
</html>
