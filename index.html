<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dental Conference Quiz</title>
  <style>
    :root {
      --bg: #f4f8f9;
      --card: #ffffff;
      --text: #102a30;
      --muted: #526f75;
      --border: #d5e4e7;
      --accent: #006874;
      --accent-hover: #004f58;
      --opt-bg: #f8fbfc;
      --opt-hover: #ebf5f7;
      --correct-bg: #d9f5e5;
      --correct-border: #1e9e5a;
      --correct-text: #0f5c33;
      --wrong-bg: #fde2e2;
      --wrong-border: #d9383a;
      --wrong-text: #7f1d1d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1719;
        --card: #152427;
        --text: #e8f3f5;
        --muted: #93b0b6;
        --border: #253d42;
        --accent: #38b6c4;
        --accent-hover: #56c8d5;
        --opt-bg: #1b2e32;
        --opt-hover: #22393e;
        --correct-bg: #133b27;
        --correct-border: #2ecc71;
        --correct-text: #a7f3c8;
        --wrong-bg: #42191a;
        --wrong-border: #ef5350;
        --wrong-text: #ffcdd2;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(0, 104, 116, 0.1);
      padding: 5px 10px;
      border-radius: 999px;
    }

    .counter {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 500;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--opt-bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--accent);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--border);
      font-weight: 700;
      font-size: 0.88rem;
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .option-btn.correct .opt-letter {
      background: var(--correct-border);
      color: #ffffff;
    }

    .option-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .option-btn.wrong .opt-letter {
      background: var(--wrong-border);
      color: #ffffff;
    }

    .explanation {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--opt-bg);
      border-left: 4px solid var(--accent);
      font-size: 0.94rem;
      line-height: 1.5;
      display: none;
    }

    .explanation.show {
      display: block;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .next-btn:hover {
      background: var(--accent-hover);
    }

    .next-btn.show {
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">Dental Booth Quiz</span>
      <span class="counter" id="statusText">Loading...</span>
    </div>

    <div id="quizBox">
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="explanation" id="explanationBox"></div>
      <div class="actions">
        <button class="next-btn" id="nextBtn" onclick="renderNextQuestion()">Next Question →</button>
      </div>
    </div>
  </div>

  <script>
    // Embedded 40 Clinical Dental Questions (Guaranteed to work 100% offline & online)
    const allQuestions = [
      { question: "Which root of the maxillary first molar is widest mesiodistally?", A: "Palatal root", B: "Mesiobuccal root", C: "Distobuccal root", D: "None of the above", correct: "A", explanation: "The palatal root is the longest and widest mesiodistally." },
      { question: "What is the primary tissue-dissolving agent in endodontic irrigation?", A: "EDTA", B: "Sodium hypochlorite (NaOCl)", C: "Chlorhexidine", D: "Saline", correct: "B", explanation: "NaOCl dissolves organic necrotic tissue and organic components of the smear layer." },
      { question: "Which test is considered the most reliable indicator of pulp vitality?", A: "Cold test", B: "Electric pulp test", C: "Heat test", D: "Cavity test", correct: "A", explanation: "Refrigerant cold tests (like Endo-Ice) consistently show high reliability for pulp testing." },
      { question: "What is the main component of Mineral Trioxide Aggregate (MTA)?", A: "Zinc oxide", B: "Calcium silicate", C: "Glass ionomer", D: "Resin matrix", correct: "B", explanation: "MTA is composed mainly of tricalcium silicate, dicalcium silicate, and tricalcium aluminate." },
      { question: "Which periodontal pathogen is a primary marker in the 'red complex'?", A: "Streptococcus mutans", B: "Actinomyces viscosus", C: "Porphyromonas gingivalis", D: "Lactobacillus acidophilus", correct: "C", explanation: "P. gingivalis is strongly associated with severe chronic periodontitis." },
      { question: "What is the average dimension of the normal biologic width?", A: "1.0 mm", B: "2.04 mm", C: "4.5 mm", D: "0.5 mm", correct: "B", explanation: "Biologic width encompasses the junctional epithelium (~0.97 mm) and connective tissue attachment (~1.07 mm)." },
      { question: "According to the 2018 periodontal classification, Stage III periodontitis is defined by:", A: "1-2 mm attachment loss", B: "Interdental CAL >= 5mm and tooth loss <= 4", C: "No tooth loss due to periodontitis", D: "Severe generalized bone loss affecting all teeth", correct: "B", explanation: "Stage III features severe attachment loss and complex management needs." },
      { question: "Which inflammatory cell is predominant in acute periodontal abscesses?", A: "Macrophage", B: "Lymphocyte", C: "Neutrophil (PMN)", D: "Eosinophil", correct: "C", explanation: "Neutrophils form the vanguard of the acute inflammatory response and purulent exudate." },
      { question: "When extracting a mandibular premolar, what is the primary movement direction?", A: "Buccal only", B: "Lingual only", C: "Rotational", D: "Buccolingual with apical pressure", correct: "D", explanation: "Mandibular premolars have oval roots and respond best to controlled buccolingual luxation." },
      { question: "What is the most frequent systemic complication following local anesthesia injection?", A: "Anaphylaxis", B: "Vasodepressor syncope (fainting)", C: "Local tissue necrosis", D: "Trismus", correct: "B", explanation: "Syncope triggered by anxiety or pain is the most common emergency in dental offices." },
      { question: "Which Le Fort fracture type involves complete separation of the midface from the cranial base?", A: "Le Fort I", B: "Le Fort II", C: "Le Fort III", D: "Mandibular angle fracture", correct: "C", explanation: "Le Fort III is craniofacial dysjunction passing through nasofrontal suture and zygomatic arches." },
      { question: "Alveolar osteitis (dry socket) typically presents most intensely on which postoperative day?", A: "Day 1", B: "Day 3 to 4", C: "Day 10", D: "Day 14", correct: "B", explanation: "Fibrinolysis of the blood clot peaks around the 3rd to 4th day post-extraction." },
      { question: "Which ceramic margin design offers optimal esthetics and strength for all-ceramic crowns?", A: "Feather-edge", B: "Bevel", C: "Heavy chamfer or rounded shoulder", D: "Knife-edge", correct: "C", explanation: "A rounded shoulder or heavy chamfer provides adequate bulk for brittle ceramic restorations." },
      { question: "Polyvinyl siloxane (PVS) impression materials release which byproduct when sulfur is present?", A: "Hydrogen gas", B: "Carbon dioxide", C: "Water vapor", D: "Chlorine gas", correct: "A", explanation: "Certain PVS formulations release hydrogen gas if reacted with latex gloves or sulfur compounds." },
      { question: "Which major connector is most rigid and commonly used for maxillary removable partial dentures?", A: "Palatal strap", B: "Horseshoe connector", C: "Complete palatal plate", D: "Anteroposterior palatal strap", correct: "D", explanation: "AP palatal strap provides maximum rigidity with minimal tissue coverage." },
      { question: "What is the purpose of an arbitrary facebow transfer?", A: "Record centric relation", B: "Relate maxillary arch to the transverse horizontal axis", C: "Measure vertical dimension of occlusion", D: "Determine interocclusal rest space", correct: "B", explanation: "Facebow transfers orient the maxilla in three-dimensional space relative to TMJs." },
      { question: "What is the primary etching concentration for phosphoric acid used in enamel bonding?", A: "10%", B: "20%", C: "37%", D: "60%", correct: "C", explanation: "37% phosphoric acid creates optimal micropores in enamel for resin tag penetration." },
      { question: "What causes polymerization shrinkage stress in resin composites?", A: "Filler particle settling", B: "Monomer conversion into a polymer network", C: "Moisture contamination", D: "Photo-initiator degradation", correct: "B", explanation: "As monomer molecules bond and form polymer chains, intermolecular distance decreases." },
      { question: "What factor increases the C-factor (configuration factor) in a restorative cavity?", A: "Fewer bonded surfaces relative to unbonded surfaces", B: "More bonded surfaces relative to unbonded surfaces", C: "Using a flowable liner", D: "Increasing curing light intensity", correct: "B", explanation: "Higher ratio of bonded to unbonded surfaces increases contraction stress." },
      { question: "Which acid is specifically used to etch porcelain veneers before silanating?", A: "Phosphoric acid", B: "Hydrofluoric acid", C: "Citric acid", D: "Carbonic acid", correct: "B", explanation: "Hydrofluoric acid selectively dissolves the glassy matrix of silica-based ceramics." },
      { question: "Which Angle classification features the mesiobuccal cusp of the maxillary first molar occluding in the buccal groove of the mandibular first molar?", A: "Class I", B: "Class II Division 1", C: "Class II Division 2", D: "Class III", correct: "A", explanation: "Angle Class I is normal molar key relationship." },
      { question: "What is a primary risk associated with excessive orthodontic tipping forces?", A: "Pulp necrosis", B: "Apical root resorption", C: "Cementum deposition", D: "Alveolar bone thickening", correct: "B", explanation: "Heavy continuous forces concentrate stress at root apices leading to resorption." },
      { question: "Which cervical vertebral maturation (CVM) stage indicates the peak mandibular growth spurt?", A: "CS1", B: "CS3 or CS4", C: "CS6", D: "CS2", correct: "B", explanation: "CS3/CS4 correlates with maximum adolescent pubertal growth velocity." },
      { question: "Orthodontic tooth movement occurs via bone resorption on which side of the PDL?", A: "Tension side", B: "Pressure side", C: "Apex only", D: "Both sides equally", correct: "B", explanation: "Compression of the periodontal ligament stimulates osteoclast activity and bone resorption." },
      { question: "Indirect pulp therapy is indicated when:", A: "There is irreversible pulpitis", B: "Deep caries approaches the pulp without pulp exposure", C: "There is spontaneous night pain", D: "The tooth is non-vital", correct: "B", explanation: "Leaving a thin layer of affected dentin prevents pulp exposure while arresting caries." },
      { question: "What is the optimal emergency storage medium for an avulsed permanent tooth?", A: "Dry tissue", B: "Tap water", C: "Cold milk or Hank's Balanced Salt Solution (HBSS)", D: "Saliva in a cup for 24 hours", correct: "C", explanation: "HBSS or cold milk maintains periodontal ligament cell viability." },
      { question: "Which space maintainer is ideal for premature loss of a mandibular primary second molar before first permanent molar eruption?", A: "Band and loop", B: "Lingual arch", C: "Distal shoe", D: "Nance appliance", correct: "C", explanation: "Distal shoe guides the unerupted permanent first molar into correct alignment." },
      { question: "Early Childhood Caries (ECC) typically impacts which teeth first?", A: "Mandibular incisors", B: "Maxillary primary incisors", C: "Primary canines", D: "Second primary molars", correct: "B", explanation: "Maxillary incisors are exposed longest to pooled sugary liquids during bottle feeding." },
      { question: "Which dental anomaly features an extra cusp located on the lingual surface of a maxillary incisor?", A: "Cusp of Carabelli", B: "Talon cusp", C: "Enamel pearl", D: "Taurodontism", correct: "B", explanation: "Talon cusps project from the cingulum area of anterior teeth." },
      { question: "What is the term for root trunk enlargement where the furcation moves apically?", A: "Taurodontism", B: "Concrescence", C: "Dilaceration", D: "Dens in dente", correct: "A", explanation: "Taurodontism features enlarged pulp chambers and displaced furcations." },
      { question: "What is the most common site for intraoral squamous cell carcinoma?", A: "Hard palate", B: "Dorsum of tongue", C: "Lateral border and ventral surface of tongue", D: "Gingiva", correct: "C", explanation: "Lateral tongue and floor of mouth are high-risk mucosal areas." },
      { question: "Radicular cysts are most commonly caused by:", A: "Developmental remnants of dental lamina", B: "Pulpal necrosis and chronic periapical inflammation", C: "Impacted third molars", D: "Salivary gland blockage", correct: "B", explanation: "Rest cell rests of Malassez proliferate due to inflammatory stimuli from necrotic pulp." },
      { question: "Odontogenic keratocyst (OKC) is notable for its high recurrence rate and association with which syndrome?", A: "Down syndrome", B: "Gorlin syndrome (Nevoid basal cell carcinoma syndrome)", C: "Papillon-Lefevre syndrome", D: "Ehlers-Danlos syndrome", correct: "B", explanation: "Multiple OKCs are a hallmark feature of Gorlin syndrome." },
      { question: "Wickham striae are characteristic clinical features of:", A: "Oral lichen planus", B: "Leukoplakia", C: "Candidiasis", D: "Pemphigus vulgaris", correct: "A", explanation: "White lacelike reticular lines (Wickham striae) mark oral lichen planus lesions." },
      { question: "What is the maximum recommended dose (MRD) of lidocaine with 1:100,000 epinephrine for healthy adults?", A: "2.0 mg/kg", B: "4.4 mg/kg (up to 300 mg max)", C: "7.0 mg/kg", D: "10.0 mg/kg", correct: "B", explanation: "Standard safe limit for lidocaine with vasoconstrictor is 4.4 mg/kg." },
      { question: "Articaine differs structurally from other amide local anesthetics by possessing:", A: "An ester side chain", B: "A thiophene ring instead of a benzene ring", C: "A tertiary amine group", D: "Double the lipid solubility", correct: "B", explanation: "Articaine contains a thiophene ring which enhances lipid solubility and diffusion." },
      { question: "Antibiotic prophylaxis for infective endocarditis is currently recommended for which patient group?", A: "All patients with mitral valve prolapse", B: "Patients with prosthetic heart valves or previous infective endocarditis", C: "Patients with simple coronary stents", D: "All cardiac patients undergoing routine prophylaxis", correct: "B", explanation: "Guidelines restrict prophylaxis to highest risk cardiac conditions." },
      { question: "Medication-Related Osteonecrosis of the Jaw (MRONJ) is most strongly linked to:", A: "Antihypertensives", B: "Bisphosphonates and antiresorptive/antiangiogenic drugs", C: "Antibiotics", D: "Antihistamines", correct: "B", explanation: "Inhibition of osteoclast bone remodeling by bisphosphonates increases MRONJ risk." },
      { question: "What is the primary function of the oblique ridge on maxillary permanent molars?", A: "Esthetics", B: "Encountering biting forces between mesiolingual and distobuccal cusps", C: "Root anchorage", D: "Pulp horn protection", correct: "B", explanation: "The oblique ridge crosses the occlusal surface connecting ML and DB cusps." },
      { question: "Which permanent tooth has the longest root overall?", A: "Maxillary central incisor", B: "Maxillary canine", C: "Mandibular first molar", D: "Maxillary third molar", correct: "B", explanation: "Maxillary canines possess exceptionally long, robust anchorage roots." }
    ];

    const STORAGE_KEY = "dental_quiz_seen_indices_40_v2";
    const ALLOW_NEXT = true;

    function getUnseenQuestionIndex(total) {
      let seen = [];
      try {
        seen = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) {
        seen = [];
      }

      let available = [];
      for (let i = 0; i < total; i++) {
        if (!seen.includes(i)) available.push(i);
      }

      if (available.length === 0) {
        seen = [];
        for (let i = 0; i < total; i++) available.push(i);
      }

      const chosen = available[Math.floor(Math.random() * available.length)];
      seen.push(chosen);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seen));
      } catch (e) {}

      return chosen;
    }

    function renderNextQuestion() {
      const idx = getUnseenQuestionIndex(allQuestions.length);
      const item = allQuestions[idx];

      document.getElementById("statusText").textContent = `Question #${idx + 1} of ${allQuestions.length}`;
      document.getElementById("questionText").textContent = item.question;

      const expBox = document.getElementById("explanationBox");
      expBox.classList.remove("show");
      expBox.textContent = "";

      const nextBtn = document.getElementById("nextBtn");
      nextBtn.classList.remove("show");

      const optionsContainer = document.getElementById("optionsContainer");
      optionsContainer.innerHTML = "";

      const displayLetters = ["A", "B", "C", "D"];
      const entries = [
        { key: "A", text: item.A },
        { key: "B", text: item.B },
        { key: "C", text: item.C },
        { key: "D", text: item.D }
      ];

      for (let i = entries.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [entries[i], entries[j]] = [entries[j], entries[i]];
      }

      entries.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.dataset.isCorrect = (opt.key === item.correct) ? "true" : "false";

        const letterSpan = document.createElement("span");
        letterSpan.className = "opt-letter";
        letterSpan.textContent = displayLetters[i];

        const textSpan = document.createElement("span");
        textSpan.textContent = opt.text;

        btn.appendChild(letterSpan);
        btn.appendChild(textSpan);

        btn.onclick = () => handleAnswer(btn, item.explanation);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedBtn, explanation) {
      const buttons = document.querySelectorAll(".option-btn");
      const isCorrect = selectedBtn.dataset.isCorrect === "true";

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.isCorrect === "true") {
          btn.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedBtn.classList.add("wrong");
      }

      if (explanation) {
        const expBox = document.getElementById("explanationBox");
        expBox.textContent = explanation;
        expBox.classList.add("show");
      }

      if (ALLOW_NEXT) {
        document.getElementById("nextBtn").classList.add("show");
      }
    }

    renderNextQuestion();
  </script>
</body>
</html>
